<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Thẻ Từ Vựng Tiếng Anh - Động Vật (Animals Flashcards)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #ff5e78;
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px #fff;
        }

        p.subtitle {
            color: #4a4a4a;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 0 #cc7a00;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cc7a00;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc7a00;
        }

        .flashcards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: transparent;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 24px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 24px;
            border: 4px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .card-front {
            background: #ffffff;
            color: #333;
        }

        .card-back {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            color: #333;
            transform: rotateY(180deg);
        }

        .emoji-container {
            font-size: 4.5rem;
            margin-top: 10px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .card:hover .emoji-container {
            transform: scale(1.15) rotate(5deg);
        }

        .word-en {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2b580c;
            margin-bottom: 5px;
        }

        .word-vi {
            font-size: 1.3rem;
            font-weight: 600;
            color: #d63447;
            margin-bottom: 5px;
        }

        .ipa {
            font-size: 1rem;
            color: #666;
            font-family: sans-serif;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .sound-btn {
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #388e3c;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .sound-btn:active {
            transform: scale(0.9);
        }

        .hint {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .flashcards-container {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .card {
                height: 240px;
            }
            .emoji-container {
                font-size: 3.5rem;
            }
            .word-en {
                font-size: 1.4rem;
            }
            .word-vi {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🦁 Animals Flashcards 🐘</h1>
        <p class="subtitle">Thẻ từ vựng Tiếng Anh chủ đề Động Vật cho bé (6-7 tuổi)</p>
        <div class="controls">
            <button class="btn" onclick="flipAll()">🔄 Lật tất cả thẻ</button>
            <button class="btn" onclick="resetCards()">✨ Làm mới</button>
        </div>
    </header>

    <div class="flashcards-container" id="cardsGrid"></div>

    <script>
        const vocabulary = [
            { en: "animal", vi: "động vật", ipa: "/ˈæn.ɪ.məl/", emoji: "🐾" },
            { en: "bear", vi: "con gấu", ipa: "/beə/", emoji: "🐻" },
            { en: "bee", vi: "con ong", ipa: "/biː/", emoji: "🐝" },
            { en: "bird", vi: "con chim", ipa: "/bɜːd/", emoji: "🐦" },
            { en: "cat", vi: "con mèo", ipa: "/kæt/", emoji: "🐱" },
            { en: "chicken", vi: "con gà", ipa: "/ˈtʃɪk.ɪn/", emoji: "🐔" },
            { en: "cow", vi: "con bò", ipa: "/kaʊ/", emoji: "🐮" },
            { en: "crocodile", vi: "con cá sấu", ipa: "/ˈkrɒk.ə.daɪl/", emoji: "🐊" },
            { en: "dog", vi: "con chó", ipa: "/dɒɡ/", emoji: "🐶" },
            { en: "donkey", vi: "con lừa", ipa: "/ˈdɒŋ.ki/", emoji: "🫏" },
            { en: "duck", vi: "con vịt", ipa: "/dʌk/", emoji: "🦆" },
            { en: "elephant", vi: "con voi", ipa: "/ˈel.ɪ.fənt/", emoji: "🐘" },
            { en: "fish", vi: "con cá", ipa: "/fɪʃ/", emoji: "🐟" },
            { en: "frog", vi: "con ếch", ipa: "/frɒɡ/", emoji: "🐸" },
            { en: "giraffe", vi: "hươu cao cổ", ipa: "/dʒɪˈrɑːf/", emoji: "🦒" },
            { en: "goat", vi: "con dê", ipa: "/ɡəʊt/", emoji: "🐐" },
            { en: "hippo", vi: "hà mã", ipa: "/ˈhɪp.əʊ/", emoji: "🦛" },
            { en: "horse", vi: "con ngựa", ipa: "/hɔːs/", emoji: "🐴" },
            { en: "jellyfish", vi: "con sứa", ipa: "/ˈdʒel.i.fɪʃ/", emoji: "🪼" },
            { en: "lizard", vi: "con thằn lằn", ipa: "/ˈlɪz.əd/", emoji: "🦎" },
            { en: "monkey", vi: "con khỉ", ipa: "/ˈmʌŋ.ki/", emoji: "🐒" },
            { en: "mouse / mice", vi: "con chuột", ipa: "/maʊs/ /maɪs/", emoji: "🐭" },
            { en: "pet", vi: "thú cưng", ipa: "/pet/", emoji: "🐶🐱" },
            { en: "polar bear", vi: "gấu bắc cực", ipa: "/ˌpəʊ.lə ˈbeə/", emoji: "🐻‍❄️" },
            { en: "sheep", vi: "con cừu", ipa: "/ʃiːp/", emoji: "🐑" },
            { en: "snake", vi: "con rắn", ipa: "/sneɪk/", emoji: "🐍" },
            { en: "spider", vi: "con nhện", ipa: "/ˈspaɪ.də/", emoji: "🕷️" },
            { en: "tail", vi: "cái đuôi", ipa: "/teɪl/", emoji: "🐒" },
            { en: "tiger", vi: "con hổ", ipa: "/ˈtaɪ.ɡə/", emoji: "🐯" },
            { en: "zebra", vi: "ngựa vằn", ipa: "/ˈzeb.rə/", emoji: "🦓" },
            { en: "zoo", vi: "sở thú", ipa: "/zuː/", emoji: "🏞️" }
        ];

        const container = document.getElementById('cardsGrid');

        function createCards() {
            container.innerHTML = '';
            vocabulary.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = (e) => {
                    if (!e.target.closest('.sound-btn')) {
                        card.classList.toggle('flipped');
                    }
                };

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="emoji-container">${item.emoji}</div>
                            <div class="word-en">${item.en}</div>
                            <div class="ipa">${item.ipa}</div>
                            <button class="sound-btn" onclick="speak('${item.en}', event)" title="Nghe âm">🔊</button>
                            <span class="hint">Chạm để lật</span>
                        </div>
                        <div class="card-back">
                            <div class="emoji-container">${item.emoji}</div>
                            <div class="word-vi">${item.vi}</div>
                            <div class="word-en" style="font-size: 1.4rem; color: #555;">${item.en}</div>
                            <button class="sound-btn" onclick="speak('${item.en}', event)" title="Nghe âm">🔊</button>
                            <span class="hint">Chạm để lật</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function speak(text, event) {
            if (event) event.stopPropagation();
            if ('speechSynthesis' in window) {
                const textToSpeak = text.split('/')[0].trim();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt không hỗ trợ phát âm!");
            }
        }

        let allFlipped = false;
        function flipAll() {
            const cards = document.querySelectorAll('.card');
            allFlipped = !allFlipped;
            cards.forEach(card => {
                if (allFlipped) {
                    card.classList.add('flipped');
                } else {
                    card.classList.remove('flipped');
                }
            });
        }

        function resetCards() {
            allFlipped = false;
            createCards();
        }

        createCards();
    </script>
</body>
</html>
